# Who runs where:
# - push to main and manual runs: the runner in the repository variable CI_RUNS_ON,
#   for example ["self-hosted","ser9"]. Without the variable, GitHub hosts the job.
# - pull requests: always a GitHub-hosted runner, and only after the owner approves
#   the run in the `pr-approval` environment. A pull request never reaches self-hosted.
# - macOS jobs always run on GitHub (macos-14). Only Linux uses CI_RUNS_ON.
# - pull requests build the oldest and the newest line. push and manual runs build every line.
# tests/ci_test.py and tests/versions_test.py check these rules.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bazel
      - name: Check the patches against pinned source
        run: bazel test //tests:source_tests //tests:source_mutation_tests //tests:stock_teeth_tests //tests:docker_test //tests:ci_test //tests:versions_test //tests:add_node_version_test

  source-tests-pr:
    if: github.event_name == 'pull_request'
    environment: pr-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bazel
      - name: Check the patches against pinned source
        run: bazel test //tests:source_tests //tests:source_mutation_tests //tests:stock_teeth_tests //tests:docker_test //tests:ci_test //tests:versions_test //tests:add_node_version_test

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20, 22, 24, 26]
        os: [macos-14, linux]
        include:
          - os: macos-14
            runs_on: '"macos-14"'
          - os: linux
            runs_on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build
        with:
          node: ${{ matrix.node }}

  build-pr:
    if: github.event_name == 'pull_request'
    environment: pr-approval
    strategy:
      fail-fast: false
      matrix:
        node: [16, 26]
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build
        with:
          node: ${{ matrix.node }}
