name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the patches against pinned source
        run: bazel test //tests:source_16_test //tests:source_18_test //tests:source_20_test //tests:source_22_test
